services:
  mongo:
    image: mongo:latest
    container_name: nutrifit-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  server:
    build: ./server
    container_name: nutrifit-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/nutrifit
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-default_jwt_secret_change_me}
      - CORS_ORIGIN=http://localhost:3000
      - NODE_ENV=development
    env_file:
      - .env
    depends_on:
      - mongo
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    build: ./client
    container_name: nutrifit-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  mongo-data:
